# nginx do frontend.
#
# O essencial é o `try_files`: a navegação do sistema é por estado no cliente,
# então qualquer caminho tem de devolver o mesmo index.html. Sem isso, recarregar
# a página numa rota interna devolve 404 — o erro clássico de SPA servida por
# servidor estático, e que só aparece quando alguém aperta F5.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Assets têm hash no nome, então podem ser cacheados para sempre. O
    # index.html não: ele é quem aponta para os assets novos depois de um
    # deploy, e cacheá-lo serve a versão velha indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
